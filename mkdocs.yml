site_name: Muffin-Admin
site_description: Admin interface for the Muffin framework
site_url: https://klen.github.io/muffin-admin/
repo_url: https://github.com/klen/muffin-admin
repo_name: klen/muffin-admin
edit_uri: edit/develop/docs/

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - Resources: resources.md
  - Custom actions: actions.md
  - Authentication: auth.md
  - Dashboard: dashboard.md
  - Customization: customization.md
  - Custom frontend: frontend.md
  - API reference: api.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
